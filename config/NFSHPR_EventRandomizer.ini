; NFSHPR Event Randomizer - re-read at the start of every event.
; The in-game menu (key in [Overlay]) changes and saves these settings.

[General]
; 0 = plugin off
Enabled=1
; 1 = only write what would change to the log, change nothing in game
LogOnly=0

[Opponents]
RandomizeRacers=1
RandomizeCops=1
; 1 = opponents and cops come from the class of the player's car
; 0 = each opponent keeps its own class (only the car changes)
MatchPlayerClass=1
; 1 = no two opponents get the same car while the class has enough cars
AvoidDuplicates=1
; 1 = opponents never get the same model as the player
AvoidPlayerModel=0
; vehicle ids never to pick, comma separated (ids are in the log)
Exclude=

[TimeOfDay]
; Default = as the event, Random, Fixed = FixedHour
Mode=Random
; hour for Mode=Fixed, 0-24 (12.5 = 12:30)
FixedHour=12.00
; 1 = the clock runs as in the original event, 0 = it stands still
KeepTimeFlow=1
; start hour range for Mode=Random, 0-24
MinHour=0
MaxHour=24
; 1 = drop the event's fixed sun direction when the time is changed
ClearSunOverride=1

[Weather]
; Default = as the event, Random, Dry, Wet, Rain, Storm
Mode=Random
; relative chances for Mode=Random
Dry=40
Wet=20
Rain=25
Storm=15

[Overlay]
; 0 = no in-game menu (the settings above still apply)
Enabled=1
; key that opens the menu: F1-F12, or a virtual-key code number
Key=F5
; menu text size in pixels, 0 = automatic
FontSize=0
